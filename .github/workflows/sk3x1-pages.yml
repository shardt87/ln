# Publish the SK-3X1 3D viewer, the GT1 bay scene and the render gallery on
# GitHub Pages. The model is rebuilt and verified against the drawing first.
name: SK-3X1 viewer on GitHub Pages

on:
  push:
    paths:
      - "plant/**"
      - ".github/workflows/sk3x1-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sk3x1-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build and verify the model
        run: |
          python3 plant/build_model.py
          python3 plant/verify.py
          python3 plant/build_viewer.py
          python3 plant/threejs/export_bay.py
      - name: Assemble the site
        run: python3 plant/site/build_site.py site
      - name: Upload the site as a download (always)
        uses: actions/upload-artifact@v4
        with:
          name: sk3x1-site
          path: site
      # Pages must be switched on once by the repo owner:
      # Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
      # Until then the site is still available as the sk3x1-site download.
      - id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
      - if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Pages status
        run: |
          if [ "${{ steps.pages.outcome }}" = "success" ]; then
            echo "Pages is enabled; deploying." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GitHub Pages is not enabled for this repository, so the site was not deployed." >> "$GITHUB_STEP_SUMMARY"
            echo "Enable it once in Settings -> Pages -> Source: GitHub Actions. The assembled site is in the **sk3x1-site** artifact." >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::GitHub Pages is not enabled; site uploaded as the sk3x1-site artifact instead"
          fi
    outputs:
      pages: ${{ steps.pages.outcome }}

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
